[project]
name = "document_management"
authors = [
    { name = "Ernesto Ruiz Escorcia", email = "eruiz@wbapps.com"}
]
description = "Standalone Document Management module for Frappe"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "cryptography",
    "unidecode",
    "pdfplumber",
    "pikepdf>=8.0.0",
    "ocrmypdf>=15.0.0",
    "tantivy",
    "faiss-cpu",
    "sentence-transformers",
    "openai",
    "scikit-learn",
    "joblib",
    "filelock",
    "numpy",
    "requests"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
